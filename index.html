</style></head><body><canvas id="c"></canvas><div class="vignette"></div><div class="damage" id="damage"></div>
<div class="screen" id="title"><div class="panel"><h1>NIGHTFALL</h1><div class="sub">COVENANT REMASTERED</div><p class="lore">A blade has weight. A parry has consequence. Break their stance, then answer with steel.</p><button class="btn" id="start">ENTER THE COURT</button><div class="help"><span class="key">WASD</span> MOVE · <span class="key">LMB</span> ATTACK · <span class="key">RMB</span> HEAVY · <span class="key">R</span> PARRY<br><span class="key">SPACE</span> DODGE · <span class="key">Q</span> LOCK-ON · <span class="key">F</span> HEAL</div></div></div>
<div class="screen hidden" id="end"><div class="panel"><h1 id="endTitle"></h1><p class="lore" id="endText"></p><button class="btn" id="retry">RISE AGAIN</button></div></div>
<div class="hud"><div class="bars"><div class="bar"><div class="fill hp" id="hp"></div></div><div class="bar"><div class="fill st" id="st"></div></div></div><div class="boss" id="boss"><div>THE PALE WARDEN</div><div class="bossbar"><div class="bossfill" id="bossHp"></div></div></div><div class="msg" id="msg"></div><div class="status" id="status"></div></div>
<script>
const C=document.querySelector('#c'),X=C.getContext('2d'),BG=new Image(),HERO=new Image(),WARDEN=new Image();BG.src='assets/citadel-v2.png';HERO.src='assets/ash-knight-sprites.png';WARDEN.src='assets/pale-warden-sprites.png';const $=s=>document.querySelector(s),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);let W,H,D=Math.min(devicePixelRatio,2),run=0,last=0,time=0,shake=0,keys={},mouse={x:0,y:0},p,enemies,fx,audio,attackSeq=0;
function resize(){W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0)}onresize=resize;resize();
function sound(f=130,d=.1,type='sine',vol=.045){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(35,f*.55),audio.currentTime+d);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}
function reset(){p={x:W*.24,y:H*.72,vx:0,vy:0,ang:0,hp:100,st:100,flask:3,attack:0,attackMax:0,heavy:0,combo:0,roll:0,inv:0,parry:0,hurt:0,step:0,move:0,lock:null,riposte:null};enemies=[];fx=[];spawn(W*.55,H*.61,0);spawn(W*.7,H*.74,0);spawn(W*.79,H*.57,1);ui()}
function spawn(x,y,boss){let e={x,y,boss,r:boss?30:21,hp:boss?420:105,max:boss?420:105,attack:0,attackMax:boss?1.08:.9,hurt:0,stagger:0,dead:0,lastHit:-1,step:Math.random()*6};enemies.push(e);return e}
function burst(x,y,color,n=18,s=180){for(let i=0;i<n;i++){let a=Math.random()*7,v=Math.random()*s;fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.3+Math.random()*.5,color,r:1+Math.random()*3})}}
function message(s,ms=900){$('#msg').textContent=s;$('#msg').classList.add('on');clearTimeout(message.timer);message.timer=setTimeout(()=>$('#msg').classList.remove('on'),ms)}
function doAttack(heavy){if(!run||p.attack||p.roll||p.hurt)return;let r=enemies.filter(e=>!e.dead&&e.stagger>0&&dist(p,e)<112).sort((a,b)=>dist(p,a)-dist(p,b))[0],cost=r?8:heavy?32:16;if(p.st<cost)return;p.st-=cost;p.parry=0;p.riposte=r||null;p.heavy=heavy||!!r;p.combo=heavy?0:(p.combo%2)+1;p.attackMax=r?.58:heavy?.72:.42;p.attack=p.attackMax;attackSeq++;sound(r?58:heavy?82:155,.14,'sawtooth')}
function roll(){if(!run||p.roll||p.attack||p.st<25)return;p.st-=25;p.roll=.46;p.inv=.34;burst(p.x,p.y,'#a9b8c2',9,90);sound(65,.18,'triangle')}
function parry(){if(!run||p.roll||p.attack||p.parry||p.st<15)return;p.st-=15;p.parry=.42;sound(360,.08,'triangle');burst(p.x,p.y,'#b8d7e8',8,80)}
function heal(){if(!run||!p.flask||p.hp>=100||p.attack||p.roll)return;p.flask--;p.hp=Math.min(100,p.hp+50);p.inv=.55;burst(p.x,p.y,'#efad4f',28);sound(430,.5,'sine',.07)}
function lock(){if(p.lock&&!p.lock.dead){p.lock=null;return}p.lock=enemies.filter(e=>!e.dead).sort((a,b)=>dist(p,a)-dist(p,b))[0]||null}
onkeydown=e=>{keys[e.key.toLowerCase()]=1;if(e.code==='Space'){e.preventDefault();roll()}if(e.key.toLowerCase()==='r')parry();if(e.key.toLowerCase()==='q')lock();if(e.key.toLowerCase()==='f')heal()};onkeyup=e=>keys[e.key.toLowerCase()]=0;C.onmousemove=e=>{mouse.x=e.clientX;mouse.y=e.clientY};C.onmousedown=e=>doAttack(e.button===2);C.oncontextmenu=e=>e.preventDefault();
function strike(e,n){if(e.dead||e.lastHit===attackSeq)return;e.lastHit=attackSeq;e.hp-=n;e.hurt=.22;e.stagger=0;shake=n>50?16:8;burst(e.x,e.y,n>50?'#fff0c8':'#b93a3e',n>50?38:18,n>50?290:190);e.x+=Math.cos(p.ang)*(n>50?42:19);e.y+=Math.sin(p.ang)*(n>50?42:19);sound(n>50?48:105,n>50?.28:.1,'square',.08);if(n>50)message('CRITICAL RIPOSTE');if(e.hp<=0){e.dead=1;burst(e.x,e.y,'#b8d9e9',45,280);if(e.boss)finish(1);else if(!enemies.some(q=>!q.dead&&!q.boss)){let b=spawn(W*.76,H*.55,1);p.lock=b;$('#boss').classList.add('on');message('THE PALE WARDEN',1600)}}}
function playerHurt(n,e){if(p.parry>.17){e.attack=0;e.stagger=e.boss?1.5:2; e.hurt=.2;p.st=Math.min(100,p.st+28);shake=18;burst(e.x,e.y,'#e8f7ff',48,270);message('PERFECT PARRY · ATTACK NOW',1200);sound(920,.32,'square',.1);return}if(p.inv)return;p.hp-=n;p.inv=.7;p.hurt=.28;shake=14;burst(p.x,p.y,'#ae2730',24);sound(55,.25,'sawtooth',.08);$('#damage').classList.add('on');setTimeout(()=>$('#damage').classList.remove('on'),140);if(p.hp<=0)finish(0)}
function update(dt){time+=dt;p.inv=Math.max(0,p.inv-dt);p.hurt=Math.max(0,p.hurt-dt);p.parry=Math.max(0,p.parry-dt);p.roll=Math.max(0,p.roll-dt);p.attack=Math.max(0,p.attack-dt);p.st=Math.min(100,p.st+dt*(p.attack?8:23));let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0),m=Math.hypot(dx,dy)||1,s=p.roll?410:180;p.move=Math.hypot(dx,dy);p.step+=dt*p.move*(p.roll?22:10);p.vx=dx/m*s;p.vy=dy/m*s;p.x=clamp(p.x+p.vx*dt,35,W-35);p.y=clamp(p.y+p.vy*dt,H*.48,H-35);p.ang=p.lock&&!p.lock.dead?Math.atan2(p.lock.y-p.y,p.lock.x-p.x):Math.atan2(mouse.y-p.y,mouse.x-p.x);
if(p.attack){let prog=1-p.attack/p.attackMax,active=p.riposte?prog>.42&&prog<.72:p.heavy?prog>.48&&prog<.76:prog>.34&&prog<.62,range=p.riposte?112:p.heavy?103:78;if(active)enemies.forEach(e=>{let a=Math.atan2(e.y-p.y,e.x-p.x),dif=Math.atan2(Math.sin(a-p.ang),Math.cos(a-p.ang));if(!e.dead&&dist(p,e)<range+e.r&&Math.abs(dif)<(p.heavy?1.15:.9))strike(e,p.riposte?(e.boss?92:130):p.heavy?48:24)})}else p.riposte=null;
for(let e of enemies){if(e.dead)continue;e.hurt=Math.max(0,e.hurt-dt);e.stagger=Math.max(0,e.stagger-dt);e.attack=Math.max(0,e.attack-dt);let ds=dist(e,p),a=Math.atan2(p.y-e.y,p.x-e.x);if(!e.hurt&&!e.stagger){if(ds>(e.boss?96:62)){let sp=e.boss?91:70;e.x+=Math.cos(a)*sp*dt;e.y+=Math.sin(a)*sp*dt;e.step+=dt*8}else if(!e.attack){e.attack=e.attackMax;let delay=e.boss?520:420,set=e;setTimeout(()=>{if(run&&!set.dead&&!set.stagger&&dist(set,p)<(set.boss?135:82))playerHurt(set.boss?24:16,set)},delay)}}}fx.forEach(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.96;f.vy*=.96;f.life-=dt});fx=fx.filter(f=>f.life>0);ui()}
function blade(x1,y1,x2,y2,enemy=0){let a=Math.atan2(y2-y1,x2-x1),nx=Math.cos(a+Math.PI/2),ny=Math.sin(a+Math.PI/2);X.save();X.shadowBlur=enemy?6:10;X.shadowColor=enemy?'#e5745b':'#b9eaff';X.fillStyle='#15191c';X.fillRect(x1-7*nx,y1-7*ny,14*nx||2,14*ny||2);X.beginPath();X.moveTo(x1+nx*5,y1+ny*5);X.lineTo(x2+nx*3,y2+ny*3);X.lineTo(x2+Math.cos(a)*12,y2+Math.sin(a)*12);X.lineTo(x2-nx*3,y2-ny*3);X.lineTo(x1-nx*5,y1-ny*5);X.closePath();let g=X.createLinearGradient(x1,y1,x2,y2);g.addColorStop(0,enemy?'#66504c':'#6e7780');g.addColorStop(.55,'#f4f0df');g.addColorStop(1,enemy?'#b56d62':'#d7f0ff');X.fillStyle=g;X.fill();X.strokeStyle='#111';X.lineWidth=1.5;X.stroke();X.restore()}
function spriteActor(e,player=0){
 let img=player?HERO:WARDEN;if(!img.complete||!img.naturalWidth)return false;
 let moving=player?p.move:(!e.stagger&&dist(e,p)>70),frame=0,prog=0;
 if(player&&p.parry)frame=6;else if(e.stagger)frame=6;else if(player&&p.attack){prog=1-p.attack/p.attackMax;frame=prog<.3?3:prog<.66?4:5}else if(!player&&e.attack){prog=1-e.attack/e.attackMax;frame=prog<.35?3:prog<.7?4:5}else if(player&&p.hurt||e.hurt)frame=7;else if(moving)frame=1+(Math.floor((player?p.step:e.step)*1.3)&1);
 let sw=img.naturalWidth/8,sh=img.naturalHeight,scale=(player?190:e.boss?245:190)/sh,dw=sw*scale,dh=sh*scale,face=Math.cos(player?p.ang:Math.atan2(p.y-e.y,p.x-e.x))<0?-1:1,bob=moving?Math.abs(Math.sin((player?p.step:e.step)))*4:Math.sin(time*2)*1.2;
 X.save();X.translate(e.x,e.y+8-bob);X.fillStyle='#000a';X.beginPath();X.ellipse(0,4,dw*.34,dh*.055,0,0,7);X.fill();
 if((player&&p.attack||!player&&e.attack)&&prog>.28&&prog<.82){let a=player?p.ang:Math.atan2(p.y-e.y,p.x-e.x),rad=player?(p.heavy?108:91):(e.boss?128:102),start=a-1.7,end=a+1.45,grad=X.createRadialGradient(0,0,rad*.25,0,0,rad);grad.addColorStop(0,'transparent');grad.addColorStop(.7,player?'#8fdcff16':'#ff735b12');grad.addColorStop(1,player?'#dff8ffb5':'#ffb19a99');X.strokeStyle=grad;X.lineWidth=player?13:16;X.shadowBlur=22;X.shadowColor=player?'#75cfff':'#ff6048';X.beginPath();X.arc(0,-dh*.38,rad,start,end);X.stroke();X.shadowBlur=0;X.strokeStyle=player?'#f3fcffcc':'#ffe1d7bb';X.lineWidth=2;X.beginPath();X.arc(0,-dh*.38,rad+5,start+.12,end);X.stroke()}
 X.scale(face,1);if(player&&p.roll){X.rotate(face*Math.sin((.46-p.roll)/.46*Math.PI)*1.1);X.globalAlpha=.58}if(e.stagger)X.rotate(face*-.14);if(e.hurt)X.globalAlpha=.58+Math.sin(time*45)*.25;
 X.imageSmoothingEnabled=true;X.imageSmoothingQuality='high';X.drawImage(img,frame*sw,0,sw,sh,-dw/2,-dh,dw,dh);X.restore();
 if(!player){X.fillStyle='#16090b';X.fillRect(e.x-28,e.y-dh-9,56,4);X.fillStyle=e.stagger?'#ead89c':'#a62e38';X.fillRect(e.x-28,e.y-dh-9,56*e.hp/e.max,4);if(e.stagger){X.fillStyle='#e8f5ff';X.font='bold 11px Arial';X.textAlign='center';X.fillText('BROKEN',e.x,e.y-dh-16)}}return true
}
function actor(e,player=0){if(spriteActor(e,player))return;let ang=player?p.ang:Math.atan2(p.y-e.y,p.x-e.x),moving=player?p.move:(!e.stagger&&dist(e,p)>70),step=player?p.step:e.step,bob=moving?Math.abs(Math.sin(step))*3:Math.sin(time*2)*.6,lean=player?(p.roll?.48:Math.sin(step)*.035):0,scale=e.boss?1.45:1;X.save();X.translate(e.x,e.y-bob);X.rotate(ang+lean);X.scale(scale,scale);if(player&&p.roll){X.rotate(Math.sin((.46-p.roll)/.46*Math.PI)*1.2);X.globalAlpha=.55}if(e.stagger)X.rotate(-.22);X.fillStyle='#0009';X.beginPath();X.ellipse(0,20,27,8,0,0,7);X.fill();let gait=moving?Math.sin(step)*10:0;
// cape and articulated legs
X.fillStyle=player?'#171d23':'#25191b';X.beginPath();X.moveTo(-9,-20);X.lineTo(-26+Math.sin(time*5)*3,25);X.lineTo(2,20);X.closePath();X.fill();X.strokeStyle='#20262c';X.lineWidth=10;X.beginPath();X.moveTo(-6,8);X.lineTo(-8+gait*.45,28);X.moveTo(7,8);X.lineTo(8-gait*.45,28);X.stroke();X.strokeStyle='#78828a';X.lineWidth=5;X.beginPath();X.moveTo(-8+gait*.45,27);X.lineTo(-12+gait,38);X.moveTo(8-gait*.45,27);X.lineTo(12-gait,38);X.stroke();
X.fillStyle=e.hurt?'#cbd5dc':player?'#303a43':e.boss?'#45333b':'#45464a';X.beginPath();X.moveTo(-15,-22);X.quadraticCurveTo(0,-32,15,-22);X.lineTo(12,9);X.lineTo(-12,9);X.closePath();X.fill();X.strokeStyle='#83909a';X.lineWidth=2;X.stroke();X.fillStyle='#111820';X.beginPath();X.arc(0,-30,11,0,7);X.fill();X.strokeStyle=player?'#8bcff0':'#d77868';X.beginPath();X.moveTo(1,-31);X.lineTo(9,-29);X.stroke();
let prog=player&&p.attack?1-p.attack/p.attackMax:e.attack?1-e.attack/e.attackMax:0,sw=0;if(player&&p.parry)sw=-1.45;else if(prog){let wind=prog<.38;if(wind)sw=-1.7+prog*.8;else sw=-1.4+(prog-.38)*5.2;if(player&&p.combo===2)sw=-sw*.9}else sw=.7;let handX=15,handY=-6,tipX=handX+Math.cos(sw)*68,tipY=handY+Math.sin(sw)*68;X.strokeStyle='#343a40';X.lineWidth=8;X.beginPath();X.moveTo(8,-14);X.lineTo(handX,handY);X.stroke();blade(handX,handY,tipX,tipY,!player);
if(prog>.38&&prog<.8){X.strokeStyle=player?'#b9e8ff77':'#f0836c66';X.lineWidth=5;X.beginPath();X.arc(0,0,70,-1.45,sw);X.stroke()}if(player&&p.parry){X.strokeStyle='#dff7ff';X.lineWidth=3;X.shadowBlur=18;X.shadowColor='#9de5ff';X.beginPath();X.arc(7,-8,34,-1.6,.8);X.stroke()}X.restore();if(!player){X.fillStyle='#16090b';X.fillRect(e.x-25,e.y-58*scale,50,4);X.fillStyle=e.stagger?'#e4d29a':'#9b3038';X.fillRect(e.x-25,e.y-58*scale,50*e.hp/e.max,4);if(e.stagger){X.fillStyle='#e8f5ff';X.font='11px Arial';X.textAlign='center';X.fillText('BROKEN',e.x,e.y-66*scale)}}}
function draw(){X.save();X.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.86;if(BG.complete)X.drawImage(BG,0,0,W,H);else{X.fillStyle='#101923';X.fillRect(0,0,W,H)}X.fillStyle='#02060a55';X.fillRect(0,0,W,H);enemies.filter(e=>!e.dead).sort((a,b)=>a.y-b.y).forEach(e=>actor(e));actor(p,1);for(let f of fx){X.globalAlpha=clamp(f.life*2,0,1);X.fillStyle=f.color;X.beginPath();X.arc(f.x,f.y,f.r,0,7);X.fill()}X.globalAlpha=1;if(p.lock&&!p.lock.dead){X.strokeStyle='#e6ddc5';X.beginPath();X.arc(p.lock.x,p.lock.y-72,7,0,7);X.stroke()}X.restore()}
function ui(){$('#hp').style.width=clamp(p.hp,0,100)+'%';$('#st').style.width=p.st+'%';$('#status').innerHTML='EMBER DRAUGHT × '+p.flask+(p.parry?'<br>PARRY WINDOW':'');let b=enemies.find(e=>e.boss&&!e.dead);if(b)$('#bossHp').style.width=100*b.hp/b.max+'%'}function finish(win){run=0;setTimeout(()=>{$('#endTitle').textContent=win?'COVENANT SEVERED':'YOU DIED';$('#endText').textContent=win?'The Warden falls. Dawn returns to the ruined court.':'Steel remembers. Rise, read the attack, and answer in the parry window.';$('#end').classList.remove('hidden')},700)}function loop(n){let dt=Math.min((n-last)/1000,.033);last=n;if(run)update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
$('#start').onclick=()=>{audio=new (AudioContext||webkitAudioContext)();$('#title').classList.add('hidden');reset();run=1;message('ASHEN COURT',1500)};$('#retry').onclick=()=>{$('#end').classList.add('hidden');$('#boss').classList.remove('on');reset();run=1};reset();
